name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20"]
        mocha-version: ["9", "10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Pin mocha test matrix version
        run: npm install --no-save "mocha@^${{ matrix.mocha-version }}"
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run test:e2e -- --ci
